        font-weight: 600;

            'tandoor': 'Tandoor',
            'snacks': 'Snacks',
            'juice_and_drinks': 'Drinks'
        };

        if (category === 'all') {
            Object.entries(groupedItems).forEach(([cat, items]) => {
                const sectionHtml = `
                    <div class="menu-section">
                        <h3 style="font-size: 1.8rem; color: #2d3748; margin: 30px 0 20px 0; border-bottom: 2px solid #e53e3e; padding-bottom: 10px;">
                            ${categoryDisplayNames[cat] || cat}
                        </h3>
                        <div class="menu-items-grid">
                            ${items.map(createMenuItemCard).join('')}
                        </div>
                    </div>
                `;
                menuGrid.innerHTML += sectionHtml;
            });
        } else {
            const items = groupedItems[category] || [];
            if (items.length > 0) {
                const sectionHtml = `
                    <div class="menu-section">
                        <h3 style="font-size: 1.8rem; color: #2d3748; margin: 30px 0 20px 0; border-bottom: 2px solid #e53e3e; padding-bottom: 10px;">
                            ${categoryDisplayNames[category] || category}
                        </h3>
                        <div class="menu-items-grid">
                            ${items.map(createMenuItemCard).join('')}
                        </div>
                    </div>
                `;
                menuGrid.innerHTML = sectionHtml;
            }
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        updateMenu();

        // Category pill click handlers
        const categoryPills = document.querySelectorAll('.category-pill');
        categoryPills.forEach(pill => {
            pill.addEventListener('click', function() {
                categoryPills.forEach(p => p.classList.remove('selected'));
                this.classList.add('selected');
                const category = this.dataset.category;
                updateMenu(category);
            });
        });
    });
</script>
</body>
